<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Ativos Imobilizados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F7F7F8;--surface:#fff;--surface2:#F7F7F8;--border:#E8E9EA;--border2:#D9DCE2;
  --accent:#2DD1AC;--accent-dark:#22a98a;--red:#d94f4f;--orange:#e07a35;
  --text:#363F4D;--muted:#A9B1BE;--mono:'DM Mono',ui-monospace,monospace;--sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45}
.mono{font-family:var(--mono);letter-spacing:.02em}
button{cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
a{color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:#fff}
.brand{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--text)}
.brand .slash{color:var(--muted)}
.top-actions{display:flex;gap:10px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f3f3f4}
.btn-primary{background:var(--accent);color:#0e3329;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-dark);color:#fff}
.btn-danger{background:#fff;color:var(--red);border-color:#f0c8c8}
.btn-danger:hover{background:#fdecec}
.layout{flex:1;display:grid;grid-template-columns:240px 1fr;gap:0}
.sidebar{padding:24px 18px;border-right:1px solid var(--border);background:#fff;min-height:calc(100vh - 65px)}
.sidebar h6{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);margin:0 0 10px;font-weight:500;text-transform:uppercase}
.sidebar h6+nav{margin-bottom:24px}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;color:var(--text);font-size:14px;cursor:pointer;margin-bottom:2px}
.nav-item .nav-l{display:flex;align-items:center;gap:10px}
.nav-item .ico{width:14px;display:inline-flex;justify-content:center;color:var(--muted)}
.nav-item .badge{font-family:var(--mono);color:var(--muted);font-size:11px}
.nav-item:hover{background:#f3f3f4}
.nav-item.active{background:#E9FBF4;color:var(--accent-dark)}
.nav-item.active .ico,.nav-item.active .badge{color:var(--accent-dark)}
.main{padding:28px 32px;overflow-x:auto}
.page-title{margin:0 0 4px;font-size:24px;font-weight:600}
.page-sub{margin:0 0 22px;color:var(--muted);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.filters .grow{flex:1;min-width:220px}
.field{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 10px;gap:8px}
.field svg{color:var(--muted);flex-shrink:0}
.field input,.field select{border:0;outline:0;background:transparent;width:100%}
.select{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.count-tag{margin-left:auto;font-family:var(--mono);color:var(--muted);font-size:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px}
.metric{font-family:var(--mono)}
.metric .label{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.metric .value{font-size:32px;color:var(--accent-dark);font-weight:600;line-height:1.1;margin-top:8px}
.metric .sub{color:var(--muted);font-size:12px;margin-top:6px}
.bar-row{display:flex;align-items:center;gap:12px;margin:6px 0}
.bar-row .name{flex:0 0 130px;font-family:var(--mono);font-size:12px}
.bar-row .bar{flex:1;height:10px;background:#EFF1F4;border-radius:6px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar-row .num{font-family:var(--mono);color:var(--muted);font-size:12px;width:34px;text-align:right}
.section-title{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px}
table.list{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
table.list th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:14px 14px;border-bottom:1px solid var(--border);font-weight:500;background:#fff}
table.list td{padding:14px 14px;border-bottom:1px solid var(--border);vertical-align:top}
table.list tr:last-child td{border-bottom:0}
table.list tr.clickable{cursor:pointer}
table.list tr.clickable:hover td{background:#fafafb}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:20px;letter-spacing:.04em}
.tag-green{background:#E9FBF4;color:var(--accent-dark)}
.tag-yellow{background:#FFF6E5;color:#A66A14}
.tag-red{background:#FBE8E8;color:var(--red)}
.tag-gray{background:#F0F1F3;color:var(--muted)}
.tag-blue{background:#E7F0FB;color:#2360A8}
.tag-orange{background:#FCEBDD;color:var(--orange)}
.etiq{font-family:var(--mono);color:var(--accent-dark);font-weight:500}
.acc-list{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.acc-list .acc{display:inline-flex;align-items:center;gap:6px;background:#F7F7F8;border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px}
.acc-list .acc .mono{color:var(--accent-dark)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,32,.42);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:80;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;border:1px solid var(--border);box-shadow:0 24px 60px rgba(0,0,0,.18);overflow:hidden}
.modal header{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px 12px}
.modal header h3{margin:0;font-size:18px}
.modal header .sub{color:var(--accent-dark);font-family:var(--mono);font-size:12px;margin-top:4px}
.modal header .x{background:transparent;border:0;font-size:20px;color:var(--muted)}
.modal .body{padding:0 22px 16px;max-height:calc(100vh - 240px);overflow-y:auto}
.modal footer{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--border);background:#fafafb}
.modal footer .right{display:flex;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.fld input,.fld select,.fld textarea{border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:#fff;width:100%}
.fld textarea{min-height:64px;resize:vertical;font-family:inherit}
.subform{background:#fafafb;border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:8px}
.subform h5{margin:0 0 10px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.acc-chip{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.acc-chip .left{display:flex;align-items:center;gap:8px}
.acc-chip .x{background:transparent;border:0;color:var(--muted);font-size:18px}
.gallery{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.gallery .ph{width:80px;height:80px;border-radius:8px;overflow:hidden;border:1px solid var(--border);position:relative;background:#f3f3f4}
.gallery .ph img{width:100%;height:100%;object-fit:cover}
.gallery .ph .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center}
.gallery .add{display:flex;align-items:center;justify-content:center;border:1px dashed var(--border2);color:var(--muted);font-size:24px}
.gallery .add input{display:none}
.nf-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:20px;background:#fff;font-size:12px;color:var(--accent-dark);text-decoration:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.empty{padding:40px;text-align:center;color:var(--muted)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--accent-dark);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:14px;color:var(--muted)}
.lock-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.lock-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:40px;max-width:380px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.04)}
.lock-card h2{margin:0 0 6px;font-size:20px}
.lock-card p{margin:0 0 22px;color:var(--muted);font-size:13px}
.lock-card .err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.qa-card h4{margin:0 0 4px;font-size:15px}
.qa-card .team{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;background:#f3f3f4;padding:2px 8px;border-radius:10px}
.qa-card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.qa-card ul li{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:13px;border-top:1px solid var(--border);padding-top:6px}
.qa-card ul li:first-child{border-top:0;padding-top:0}
.qa-card .item-name{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qa-card .item-val{text-align:right;font-size:12px;color:var(--text)}
@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{min-height:auto;border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<!-- Lock screen -->
<div id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <h2>Controle de Ativos</h2>
    <p>Digite a senha para acessar</p>
    <form id="lockForm">
      <div class="fld"><label>Senha</label><input type="password" id="lockPwd" autocomplete="current-password" autofocus></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px">Entrar</button>
      <div class="err" id="lockErr"></div>
    </form>
  </div>
</div>

<!-- App shell -->
<div class="app" id="app" style="display:none">
  <div class="topbar">
    <div class="brand">ATIVOS<span class="slash">/</span>IMOBILIZADOS</div>
    <div class="top-actions">
      <button class="btn btn-primary" id="btnNew">+ Novo Ativo</button>
      <button class="btn" id="btnExport">&darr; Exportar CSV</button>
    </div>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <h6>Navegação</h6>
      <nav id="nav">
        <div class="nav-item" data-view="dashboard"><span class="nav-l"><span class="ico">&#9670;</span>Dashboard</span></div>
        <div class="nav-item" data-view="emuso"><span class="nav-l"><span class="ico">&bull;</span>Em Uso</span><span class="badge" id="cnt-emuso">0</span></div>
        <div class="nav-item" data-view="estoque"><span class="nav-l"><span class="ico">&#9675;</span>Estoque</span><span class="badge" id="cnt-estoque">0</span></div>
        <div class="nav-item" data-view="baixados"><span class="nav-l"><span class="ico">&times;</span>Baixados</span><span class="badge" id="cnt-baixados">0</span></div>
        <div class="nav-item" data-view="etiquetas"><span class="nav-l"><span class="ico">&#9873;</span>Etiquetas</span><span class="badge" id="cnt-etiquetas">0</span></div>
        <div class="nav-item" data-view="apple"><span class="nav-l"><span class="ico">&#63743;</span>Apple</span><span class="badge" id="cnt-apple">0</span></div>
        <div class="nav-item" data-view="qa"><span class="nav-l"><span class="ico">&#9784;</span>QA</span><span class="badge" id="cnt-qa">0</span></div>
      </nav>
      <h6>Gestão</h6>
      <nav>
        <div class="nav-item" data-view="depreciacao"><span class="nav-l"><span class="ico">&#8600;</span>Depreciação</span></div>
      </nav>
    </aside>
    <main class="main" id="main">
      <div class="loading-screen"><span class="spinner"></span><span>Carregando ativos...</span></div>
    </main>
  </div>
</div>

<!-- Asset Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <header>
      <div>
        <h3 id="mTitle">Ativo</h3>
        <div class="sub" id="mSub"># etiqueta</div>
      </div>
      <button class="x" id="mClose">&times;</button>
    </header>
    <div class="body" id="mBody"></div>
    <footer>
      <button class="btn btn-danger" id="mDel">Excluir</button>
      <div class="right">
        <button class="btn" id="mCancel">Cancelar</button>
        <button class="btn btn-primary" id="mSave">Salvar Alterações</button>
      </div>
    </footer>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
// ============= Supabase =============
const SUPA_URL = 'https://akcafrjrofpqmveiysym.supabase.co';
const SUPA_KEY = 'sb_publishable_JPFvx6jAFbb3fjnSDlroww_LJ-6FbZA';
const APP_PWD  = 'FinDevKyte26*';
const SESS_KEY = 'ativos_auth_v1';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// ============= State =============
let DATA = [];           // all rows from ativos
let view = 'dashboard';
let filters = {};
let editing = null;      // current asset being edited (clone)

// ============= Auth gate =============
const lock = document.getElementById('lockScreen');
const app  = document.getElementById('app');
const lockForm = document.getElementById('lockForm');
const lockPwd  = document.getElementById('lockPwd');
const lockErr  = document.getElementById('lockErr');

function unlock(){ lock.style.display = 'none'; app.style.display = 'flex'; boot(); }
function tryAuth(){
  if (sessionStorage.getItem(SESS_KEY) === '1') { unlock(); return true; }
  return false;
}
lockForm.addEventListener('submit', e => {
  e.preventDefault();
  if (lockPwd.value === APP_PWD) {
    sessionStorage.setItem(SESS_KEY, '1');
    lockErr.textContent = '';
    unlock();
  } else {
    lockErr.textContent = 'Senha incorreta';
    lockPwd.value = '';
  }
});

// ============= Helpers =============
function toast(msg, ms=2200){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), ms);
}
function fmtBR(n){ if(n==null||n==='') return ''; const x=Number(n); if(isNaN(x)) return n; return x.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return ''; const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); return m? `${m[3]}/${m[2]}/${m[1]}` : d; }
function uniq(arr){ return [...new Set(arr.filter(v=>v!=null && v!==''))].sort((a,b)=>(''+a).localeCompare(''+b,'pt')); }
function statusTag(s){
  const v=(s||'').toUpperCase();
  if(v==='EM USO') return '<span class="tag tag-green">EM USO</span>';
  if(v==='ESTOQUE') return '<span class="tag tag-yellow">ESTOQUE</span>';
  if(v==='BAIXA') return '<span class="tag tag-red">BAIXA</span>';
  return '<span class="tag tag-gray">'+ (s? s : 'SEM STATUS') +'</span>';
}
function estadoTag(e){
  if(!e) return '<span style="color:var(--muted)">&mdash;</span>';
  const v = e.toUpperCase();
  if(v==='BOM') return '<span class="tag tag-green">BOM</span>';
  if(v==='ESTRAGADO') return '<span class="tag tag-red">ESTRAGADO</span>';
  if(v==='TRAVANDO') return '<span class="tag tag-orange">TRAVANDO</span>';
  if(v==='MARCAS DE USO') return '<span class="tag tag-yellow">MARCAS DE USO</span>';
  return '<span class="tag tag-gray">'+e+'</span>';
}
function debounce(fn, ms){ let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a), ms); } }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============= Data layer (Supabase) =============
async function loadAll(){
  const { data, error } = await sb.from('ativos').select('*').order('etiqueta',{ascending:true});
  if (error) { toast('Erro ao carregar: '+error.message); throw error; }
  DATA = (data||[]).map(r => ({
    ...r,
    acessorios: Array.isArray(r.acessorios)? r.acessorios : (r.acessorios? JSON.parse(r.acessorios): []),
    historico:  Array.isArray(r.historico)?  r.historico  : (r.historico?  JSON.parse(r.historico) : []),
    imagens:    Array.isArray(r.imagens)?    r.imagens    : (r.imagens?    JSON.parse(r.imagens)   : []),
    nf_anexo:   r.nf_anexo || null,
  }));
}
async function saveAsset(row){
  const { id, ...rest } = row;
  rest.updated_at = new Date().toISOString();
  if (id) {
    const { error } = await sb.from('ativos').update(rest).eq('id', id);
    if (error) throw error;
    return id;
  } else {
    const { data, error } = await sb.from('ativos').insert(rest).select('id').single();
    if (error) throw error;
    return data.id;
  }
}
async function deleteAsset(id){
  const { error } = await sb.from('ativos').delete().eq('id', id);
  if (error) throw error;
}
async function uploadFile(file, prefix='img'){
  const ext = (file.name.match(/\.[^.]+$/)||[''])[0];
  const path = `${prefix}/${Date.now()}-${Math.random().toString(36).slice(2,8)}${ext}`;
  const { error } = await sb.storage.from('ativos').upload(path, file, {cacheControl:'3600', upsert:false});
  if (error) throw error;
  const { data } = sb.storage.from('ativos').getPublicUrl(path);
  return { url: data.publicUrl, path, name: file.name, size: file.size, type: file.type };
}

// ============= Boot =============
async function boot(){
  try {
    await loadAll();
    setupNav();
    renderCounts();
    setView('dashboard');
  } catch(e){
    document.getElementById('main').innerHTML = '<div class="empty">Erro ao carregar dados. '+escapeHtml(e.message||'')+'</div>';
  }
}

function renderCounts(){
  const cnt = { emuso:0, estoque:0, baixados:0, etiquetas:0, apple:0, qa:0 };
  DATA.forEach(a => {
    const st = (a.status||'').toUpperCase();
    if (st === 'EM USO') cnt.emuso++;
    if (st === 'ESTOQUE') cnt.estoque++;
    if (st === 'BAIXA') cnt.baixados++;
    if ((a.marca||'').toUpperCase()==='APPLE') cnt.apple++;
    cnt.etiquetas += 1 + (a.acessorios?.length||0);
  });
  // QA: people responsible with QA-related items (we count distinct responsaveis that have at least one item)
  const respQA = new Set();
  DATA.forEach(a => { if (a.responsavel && !/^Perda|^Estoque/i.test(a.responsavel)) respQA.add(a.responsavel); });
  cnt.qa = respQA.size;
  for (const k in cnt) {
    const el = document.getElementById('cnt-'+k);
    if (el) el.textContent = cnt[k];
  }
}

function setupNav(){
  document.querySelectorAll('#nav .nav-item, .sidebar nav .nav-item').forEach(it => {
    it.addEventListener('click', () => setView(it.dataset.view));
  });
  document.getElementById('btnNew').addEventListener('click', ()=>openModal(null));
  document.getElementById('btnExport').addEventListener('click', exportCSV);
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('mSave').addEventListener('click', saveFromModal);
  document.getElementById('mDel').addEventListener('click', delFromModal);
  document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id==='modalBg') closeModal(); });
}

function setView(v){
  view = v;
  filters = {};
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view===v));
  render();
}

// ============= Views =============
function render(){
  const m = document.getElementById('main');
  if (view==='dashboard') return m.replaceChildren(...renderDashboard());
  if (view==='emuso')     return m.replaceChildren(...renderList('Em Uso','Ativos atualmente alocados',a => (a.status||'').toUpperCase()==='EM USO', {accessoryUI:true}));
  if (view==='estoque')   return m.replaceChildren(...renderList('Estoque','Ativos disponíveis',a => (a.status||'').toUpperCase()==='ESTOQUE', {flatAccessories:true}));
  if (view==='baixados')  return m.replaceChildren(...renderList('Baixados','Ativos desativados', a => (a.status||'').toUpperCase()==='BAIXA', {flatAccessories:true}));
  if (view==='etiquetas') return m.replaceChildren(...renderEtiquetas());
  if (view==='apple')     return m.replaceChildren(...renderApple());
  if (view==='qa')        return m.replaceChildren(...renderQA());
  if (view==='depreciacao') return m.replaceChildren(...renderDepreciacao());
}

function renderDashboard(){
  const total = DATA.length;
  const valSum = DATA.reduce((s,a)=>s + Number(a.valor_atual||0), 0);
  const byDept = {}, byMarca = {};
  DATA.forEach(a => {
    const d = a.departamento || 'Sem dept';
    const m = a.marca || 'Sem marca';
    byDept[d] = (byDept[d]||0)+1;
    byMarca[m] = (byMarca[m]||0)+1;
  });
  const sortObj = o => Object.entries(o).sort((a,b)=>b[1]-a[1]);
  const max = arr => arr.reduce((m,[,v])=>v>m?v:m, 1);
  const dept = sortObj(byDept), marca = sortObj(byMarca);
  const mxD = max(dept), mxM = max(marca);
  const root = el(`<div>
    <h2 class="page-title">Dashboard</h2>
    <p class="page-sub">Visão geral do patrimônio</p>
    <div class="cards-row">
      <div class="card metric"><div class="label">Total de itens</div><div class="value">${total}</div><div class="sub">ativos cadastrados</div></div>
      <div class="card metric"><div class="label">Valor atual estimado</div><div class="value">R$ ${fmtBR(valSum)}</div><div class="sub">soma de valor_atual</div></div>
    </div>
    <div class="cards-row">
      <div class="card"><h5 class="section-title">Por departamento</h5><div id="ddept"></div></div>
      <div class="card"><h5 class="section-title">Por marca</h5><div id="dmarc"></div></div>
    </div>
  </div>`);
  const ddept = root.querySelector('#ddept');
  dept.forEach(([n,v]) => ddept.appendChild(el(`<div class="bar-row"><span class="name">${escapeHtml(n)}</span><span class="bar"><i style="width:${(v/mxD*100).toFixed(1)}%"></i></span><span class="num">${v}</span></div>`)));
  const dmarc = root.querySelector('#dmarc');
  marca.forEach(([n,v]) => dmarc.appendChild(el(`<div class="bar-row"><span class="name">${escapeHtml(n)}</span><span class="bar"><i style="width:${(v/mxM*100).toFixed(1)}%"></i></span><span class="num">${v}</span></div>`)));
  return [root];
}

function renderList(title, sub, predicate, opts={}){
  const root = el(`<div>
    <h2 class="page-title">${title}</h2>
    <p class="page-sub">${sub}</p>
    <div class="filters">
      <div class="field grow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="fSearch" placeholder="Buscar..."></div>
      <select class="select" id="fDept"></select>
      <select class="select" id="fItem"></select>
      <select class="select" id="fResp"></select>
      <span class="count-tag" id="fCount"></span>
    </div>
    <table class="list"><thead><tr>
      <th>Etiqueta</th><th>Marca</th><th>Item / Acessórios</th><th>Modelo</th><th>Responsável</th><th>Status</th><th>Depto</th><th>Estado</th>
    </tr></thead><tbody id="lbody"></tbody></table>
  </div>`);
  const fDept = root.querySelector('#fDept');
  const fItem = root.querySelector('#fItem');
  const fResp = root.querySelector('#fResp');
  const fSearch = root.querySelector('#fSearch');
  const tbody = root.querySelector('#lbody');
  const count = root.querySelector('#fCount');

  // Build base set
  let baseSet = DATA.filter(predicate);
  // If flat accessories, also surface accessories as virtual rows
  if (opts.flatAccessories){
    const extras = [];
    DATA.forEach(a => {
      (a.acessorios||[]).forEach(ac => {
        // an accessory is also "in this view" if its status matches
        const acStatus = (ac.status||a.status||'').toUpperCase();
        if (predicate({status: acStatus})) {
          extras.push({
            id: 'acc-'+ a.id + '-' + (ac.etiqueta||Math.random()),
            etiqueta: ac.etiqueta || '',
            marca: ac.marca || a.marca,
            item: ac.item || 'ACESSÓRIO',
            modelo: ac.modelo || '',
            responsavel: ac.responsavel || a.responsavel,
            status: acStatus,
            departamento: ac.departamento || a.departamento,
            estado: ac.estado || '',
            serie: ac.serie || '',
            _isAccessory: true,
            _parent: a,
          });
        }
      });
    });
    baseSet = baseSet.concat(extras);
  }

  fDept.appendChild(el('<option value="">Todos os departamentos</option>'));
  uniq(baseSet.map(a=>a.departamento)).forEach(d => fDept.appendChild(el(`<option>${escapeHtml(d)}</option>`)));
  fItem.appendChild(el('<option value="">Todos os itens</option>'));
  uniq(baseSet.map(a=>a.item)).forEach(d => fItem.appendChild(el(`<option>${escapeHtml(d)}</option>`)));
  fResp.appendChild(el('<option value="">Todos os responsáveis</option>'));
  uniq(baseSet.map(a=>a.responsavel)).forEach(d => fResp.appendChild(el(`<option>${escapeHtml(d)}</option>`)));

  function applyFilters(){
    const q = (fSearch.value||'').toLowerCase().trim();
    const list = baseSet.filter(a => {
      if (fDept.value && (a.departamento||'') !== fDept.value) return false;
      if (fItem.value && (a.item||'') !== fItem.value) return false;
      if (fResp.value && (a.responsavel||'') !== fResp.value) return false;
      if (q) {
        const hay = [a.etiqueta,a.marca,a.item,a.modelo,a.serie,a.responsavel,a.departamento,a.status].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    tbody.replaceChildren(...list.map(a => rowFor(a, opts)));
    count.textContent = list.length + ' itens';
  }
  fSearch.addEventListener('input', debounce(applyFilters, 180));
  [fDept,fItem,fResp].forEach(f => f.addEventListener('change', applyFilters));
  applyFilters();
  return [root];
}

function rowFor(a, opts={}){
  const accHtml = (!opts.flatAccessories && a.acessorios && a.acessorios.length)
    ? '<div class="acc-list">' + a.acessorios.map(ac => `<span class="acc">&#128268;<span class="mono">#${escapeHtml(ac.etiqueta||'')}</span> ${escapeHtml(ac.item||'')}</span>`).join('') + '</div>'
    : '';
  const tr = el(`<tr class="clickable">
    <td><span class="etiq">${escapeHtml(a.etiqueta||'')}</span></td>
    <td>${escapeHtml(a.marca||'')}</td>
    <td><div><strong>${escapeHtml(a.item||'')}</strong></div>${accHtml}</td>
    <td>${escapeHtml(a.modelo||'')}</td>
    <td>${escapeHtml(a.responsavel||'')}</td>

    <td>${escapeHtml(a.departamento||'')}</td>

  return tr;
}

function renderApple(){
  const apples = DATA.filter(a => (a.marca||'').toUpperCase()==='APPLE' && (a.status||'').toUpperCase()!=='BAIXA');
  const baixados = DATA.filter(a => (a.marca||'').toUpperCase()==='APPLE' && (a.status||'').toUpperCase()==='BAIXA');
  function specsFrom(a){
    // Extract processor/RAM/Storage from modelo + observacoes when possible
    const txt = ((a.modelo||'') + ' ' + (a.observacoes||'')).toUpperCase();
    const proc = (txt.match(/(M[1-4](?:\s*(?:PRO|MAX|ULTRA))?(?:\s*\d+\s*CORE)?)/) || [])[1] || (txt.match(/(INTEL[^,\n]*?(?:CORE\s+I\d|XEON)[^,\n]*?)(?:\s|$)/)||[])[1] || '';
    const ram  = (txt.match(/(\d{1,3}\s*GB?\s*RAM)|(\d{1,3}G\s*RAM)/) || [])[0] || (txt.match(/\b(\d{1,3})\s*GB\s*RAM\b/i)||[])[0] || '';
    const stor = (txt.match(/(\d{2,4}\s*GB(?:\s*SSD)?|\d\s*TB)/) || [])[0] || '';
    return { proc, ram, stor };
  }
  const root = el(`<div>
    <h2 class="page-title">Apple</h2>
    <p class="page-sub">Equipamentos Apple por usuário</p>
    <div class="filters">
      <div class="field grow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="fSearch" placeholder="Buscar por modelo, usuário, serial..."></div>

    <h3 style="margin:28px 0 10px;font-size:16px">Baixados</h3>
    <table class="list"><thead><tr>
      <th>Modelo</th><th>Serial</th><th>Destino</th><th>Usuário (antigo)</th><th>Histórico</th>
    </tr></thead><tbody id="lb2"></tbody></table>
  </div>`);
  const fSearch = root.querySelector('#fSearch');
  const fDept = root.querySelector('#fDept');
  const tbody = root.querySelector('#lb');
  const tbody2 = root.querySelector('#lb2');
  fDept.appendChild(el('<option value="">Todos os setores</option>'));
  uniq(apples.map(a=>a.departamento)).forEach(d => fDept.appendChild(el(`<option>${escapeHtml(d)}</option>`)));

  function applyA(){
    const q = (fSearch.value||'').toLowerCase().trim();
    const list = apples.filter(a => {
      if (fDept.value && a.departamento !== fDept.value) return false;
      if (q) {
        const hay = [a.modelo,a.serie,a.responsavel,a.departamento,a.etiqueta].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    tbody.replaceChildren(...list.map(a => {
      const s = specsFrom(a);
      const tr = el(`<tr class="clickable">
        <td><strong>${escapeHtml(a.modelo||'')}</strong><div style="color:var(--muted);font-size:11px;font-family:var(--mono)">#${escapeHtml(a.etiqueta||'')}</div></td>
        <td>${escapeHtml(s.proc)}</td>
        <td>${escapeHtml(s.ram)}</td>
        <td>${escapeHtml(s.stor)}</td>
        <td class="mono" style="font-size:12px">${escapeHtml(a.serie||'')}</td>
        <td>${escapeHtml(a.departamento||'')}</td>

      </tr>`);
      tr.addEventListener('click', ()=>openModal(a));

function renderQA(){
  // Group by responsavel (skip Perda/Estoque*), each card lists their items and accessories
  const byPerson = new Map();
  DATA.forEach(a => {
    const r = a.responsavel;
    if (!r) return;
    if (/^(Perda|Estoque)/i.test(r)) return;
    if ((a.status||'').toUpperCase()==='BAIXA') return;
    if (!byPerson.has(r)) byPerson.set(r, { team: a.departamento || '', items: [], accessories: [] });
    const card = byPerson.get(r);
    if (!card.team && a.departamento) card.team = a.departamento;
    card.items.push(a);
    (a.acessorios||[]).forEach(ac => card.accessories.push({...ac, _from: a}));
  });
  const people = [...byPerson.entries()].sort((x,y)=>x[0].localeCompare(y[0],'pt'));

  const root = el(`<div>
    <h2 class="page-title">QA</h2>
    <p class="page-sub">Visão por responsável — itens principais e acessórios</p>
    <div class="filters">
      <div class="field grow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="fSearch" placeholder="Buscar pessoa, equipamento..."></div>
      <select class="select" id="fTeam"></select>
      <span class="count-tag">${people.length} pessoas</span>
    </div>
    <div class="qa-grid" id="qg"></div>
  </div>`);
  const fSearch = root.querySelector('#fSearch');
  const fTeam = root.querySelector('#fTeam');
  const qg = root.querySelector('#qg');
  fTeam.appendChild(el('<option value="">Todos os times</option>'));
  uniq(people.map(([,c])=>c.team)).forEach(d => fTeam.appendChild(el(`<option>${escapeHtml(d)}</option>`)));

  function applyQ(){
    const q = (fSearch.value||'').toLowerCase().trim();
    qg.replaceChildren();
    people.forEach(([name, card]) => {
      if (fTeam.value && card.team !== fTeam.value) return;
      if (q) {
        const hay = (name + ' ' + card.team + ' ' + card.items.map(i=>(i.item+' '+i.modelo)).join(' ') + ' ' + card.accessories.map(a=>a.item+' '+a.modelo).join(' ')).toLowerCase();
        if (!hay.includes(q)) return;
      }
      const itemsHtml = card.items.map(i => `<li><span class="item-name">${escapeHtml(i.item||'')}</span><span class="item-val">${escapeHtml(i.modelo||'')}<br><span style="color:var(--muted);font-family:var(--mono);font-size:11px">#${escapeHtml(i.etiqueta||'')} · ${escapeHtml(i.marca||'')}</span></span></li>`).join('');
      const accHtml = card.accessories.length ? `<li style="margin-top:8px"><span class="item-name">Acessórios</span><span class="item-val">${card.accessories.map(a=>`#${escapeHtml(a.etiqueta||'')} ${escapeHtml(a.item||'')}`).join('<br>')}</span></li>` : '';
      const c = el(`<div class="card qa-card"><h4>${escapeHtml(name)}</h4><span class="team">${escapeHtml(card.team||'—')}</span><ul>${itemsHtml}${accHtml}</ul></div>`);
      // click on first item opens modal
      c.addEventListener('click', () => { if (card.items[0]) openModal(card.items[0]); });
      c.style.cursor = 'pointer';
      qg.appendChild(c);
    });
  }
  fSearch.addEventListener('input', debounce(applyQ, 180));
  fTeam.addEventListener('change', applyQ);
  applyQ();
  return [root];
}

function renderDepreciacao(){
  // Simple linear depreciation over vida_util years
  const today = new Date();
  const rows = DATA.filter(a => a.valor && a.vida_util && a.data_compra).map(a => {
    const dc = new Date(a.data_compra);
    const ageYears = (today - dc) / (1000*60*60*24*365.25);
    const life = Number(a.vida_util);
    const remaining = Math.max(0, life - ageYears);
    const depPct = Math.min(100, Math.max(0, (ageYears/life)*100));
    const current = Number(a.valor) * (1 - depPct/100);
    return { a, ageYears, life, depPct, current };
  });
  const total = rows.reduce((s,r)=>s+r.current,0);
  const totalOrig = rows.reduce((s,r)=>s+Number(r.a.valor||0),0);
  const root = el(`<div>
    <h2 class="page-title">Depreciação</h2>
    <p class="page-sub">Estimativa linear pelo tempo decorrido sobre a vida útil</p>
    <div class="cards-row">
      <div class="card metric"><div class="label">Valor de aquisição</div><div class="value">R$ ${fmtBR(totalOrig)}</div></div>
      <div class="card metric"><div class="label">Valor depreciado</div><div class="value">R$ ${fmtBR(total)}</div></div>
    </div>
    <table class="list"><thead><tr><th>Etiqueta</th><th>Item</th><th>Modelo</th><th>Data Compra</th><th>Vida (anos)</th><th>Depreciação</th><th>Valor original</th><th>Valor atual estimado</th></tr></thead><tbody></tbody></table>
  </div>`);
  const tb = root.querySelector('tbody');
  rows.sort((x,y)=>y.depPct - x.depPct).forEach(r => {
    const tr = el(`<tr class="clickable">
      <td><span class="etiq">#${escapeHtml(r.a.etiqueta||'')}</span></td>
      <td>${escapeHtml(r.a.item||'')}</td>
      <td>${escapeHtml(r.a.modelo||'')}</td>
      <td>${fmtDate(r.a.data_compra)}</td>
      <td>${r.life}</td>
      <td>${r.depPct.toFixed(1)}%</td>
      <td>R$ ${fmtBR(r.a.valor)}</td>
      <td>R$ ${fmtBR(r.current)}</td>
    </tr>`);
    tr.addEventListener('click', ()=>openModal(r.a));
    tb.appendChild(tr);
  });
  return [root];
}

// ============= Modal (Edit / Create) =============
function openModal(a, opts={}){
  editing = a ? JSON.parse(JSON.stringify(a)) : {
    etiqueta:'', marca:'', item:'', modelo:'', serie:'', responsavel:'', status:'EM USO',
    departamento:'', estado:'BOM', valor:null, valor_atual:null, data_compra:null, vencimento:null,
    proxima_revisao:null, fornecedor:'', nf:'', idade:'', vida_util:null, observacoes:'', motivo:'',
    nf_anexo:null, acessorios:[], historico:[], imagens:[]
  };
  document.getElementById('mTitle').textContent = (editing.item||'Ativo') + ' ' + (editing.marca||'');
  document.getElementById('mSub').textContent = editing.etiqueta ? ('# Etiqueta '+ editing.etiqueta) : '+ Novo ativo';
  document.getElementById('mDel').style.display = editing.id ? '' : 'none';
  renderModalBody();
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
  editing = null;
}

function buildOptions(field){
  const set = new Set();
  DATA.forEach(a => { if (a[field]) set.add(a[field]); });
  const arr = [...set].sort((a,b)=>a.localeCompare(b,'pt'));
  if (editing[field] && !arr.includes(editing[field])) arr.unshift(editing[field]);
  return arr;
}

function selectFld(label, field, options){
  const cur = editing[field] || '';
  const opts = options.map(o => `<option value="${escapeHtml(o)}" ${o===cur?'selected':''}>${escapeHtml(o)}</option>`).join('');
  return `<div class="fld"><label>${label}</label>
    <select data-field="${field}">
      <option value="">—</option>
      ${opts}
    </select>
    <input type="text" data-field-other="${field}" placeholder="ou digite outro..." style="margin-top:6px;font-size:12px;border:1px dashed var(--border2);border-radius:6px;padding:6px 8px">
  </div>`;
}
function textFld(label, field, type='text'){
  const v = editing[field]==null?'':editing[field];
  return `<div class="fld"><label>${label}</label><input type="${type}" data-field="${field}" value="${escapeHtml(v)}"></div>`;
}
function dateFld(label, field){
  const v = editing[field] ? String(editing[field]).slice(0,10) : '';
  return `<div class="fld"><label>${label}</label><input type="date" data-field="${field}" value="${v}"></div>`;
}
function textareaFld(label, field){
  const v = editing[field]||'';
  return `<div class="fld"><label>${label}</label><textarea data-field="${field}">${escapeHtml(v)}</textarea></div>`;
}

function renderModalBody(){
  const body = document.getElementById('mBody');
  const html = `
    <div class="grid-2">
      ${textFld('Etiqueta','etiqueta')}
      ${selectFld('Marca','marca', buildOptions('marca'))}
      ${selectFld('Tipo de item','item', buildOptions('item'))}
      ${textFld('Modelo','modelo')}
      ${textFld('Nº série','serie')}
      ${selectFld('Status','status', ['EM USO','ESTOQUE','BAIXA'])}
      ${selectFld('Responsável','responsavel', buildOptions('responsavel'))}
      ${selectFld('Departamento','departamento', buildOptions('departamento'))}
      ${selectFld('Estado','estado', ['BOM','ESTRAGADO','TRAVANDO','MARCAS DE USO'])}
      ${dateFld('Data de compra','data_compra')}
      ${textFld('Valor (R$)','valor','number')}
      ${textFld('Vida útil (anos)','vida_util','number')}
      ${selectFld('Fornecedor','fornecedor', buildOptions('fornecedor'))}
      ${textFld('NF','nf')}
      ${dateFld('Vencimento','vencimento')}
      ${dateFld('Próxima revisão','proxima_revisao')}
    </div>
    ${textareaFld('Motivo / Manutenção','motivo')}
    ${textareaFld('Observações','observacoes')}

    <div class="subform"><h5>Fotos do ativo</h5>
      <div class="gallery" id="gImg"></div>
    </div>

    <div class="subform"><h5>Nota Fiscal (PDF/imagem)</h5>
      <div id="nfArea"></div>
    </div>

    <div class="subform"><h5>Acessórios vinculados</h5>
      <div id="accArea"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn" type="button" id="accFromStock">+ Vincular do estoque</button>
        <button class="btn" type="button" id="accNew">+ Criar novo acessório</button>
      </div>
    </div>

    <div class="subform"><h5>Histórico de movimentações</h5>
      <div id="histArea"></div>
      <div class="grid-3" style="margin-top:10px">
        <div class="fld"><label>Tipo</label><select id="hType"><option>Transferência</option><option>Manutenção</option><option>Baixa</option><option>Devolução</option></select></div>
        <div class="fld"><label>Data</label><input type="date" id="hDate" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="fld"><label>De</label><input id="hFrom" value="${escapeHtml(editing.responsavel||'')}"></div>
        <div class="fld"><label>Para</label><input id="hTo" placeholder="Novo responsável / local"></div>
        <div class="fld" style="grid-column:span 2"><label>Observação</label><input id="hObs" placeholder="Motivo, detalhes..."></div>
      </div>
      <button class="btn btn-primary" type="button" id="hAdd" style="margin-top:6px">Registrar</button>
    </div>
  `;
  body.innerHTML = html;
  // Bind selects + text fields
  body.querySelectorAll('[data-field]').forEach(inp => {
    inp.addEventListener('change', e => {
      const f = e.target.dataset.field;
      let v = e.target.value;
      if (e.target.type === 'number') v = v===''?null:Number(v);
      editing[f] = v;
    });
  });
  body.querySelectorAll('[data-field-other]').forEach(inp => {
    inp.addEventListener('change', e => {
      const f = e.target.dataset.fieldOther;
      const v = e.target.value.trim();
      if (v) { editing[f] = v; const sel = body.querySelector(`select[data-field="${f}"]`); if (sel){ if(![...sel.options].some(o=>o.value===v)) sel.appendChild(el(`<option selected>${escapeHtml(v)}</option>`)); sel.value = v; } }
    });
  });
  renderGallery();
  renderNFArea();
  renderAccArea();
  renderHistArea();
  body.querySelector('#accFromStock').addEventListener('click', accLinkFromStock);
  body.querySelector('#accNew').addEventListener('click', accCreateNew);
  body.querySelector('#hAdd').addEventListener('click', addHistory);
}

function renderGallery(){
  const g = document.getElementById('gImg');
  g.replaceChildren();
  (editing.imagens||[]).forEach((img, i) => {
    const div = el(`<div class="ph"><img src="${img.url||img}" alt=""><button class="rm" data-i="${i}">&times;</button></div>`);
    div.querySelector('.rm').addEventListener('click', () => { editing.imagens.splice(i,1); renderGallery(); });
    g.appendChild(div);
  });
  const add = el(`<label class="ph add">+<input type="file" accept="image/*" multiple></label>`);
  add.querySelector('input').addEventListener('change', async (e) => {
    for (const f of e.target.files) {
      try {
        const r = await uploadFile(f, 'fotos');
        editing.imagens = editing.imagens || [];
        editing.imagens.push(r);
        renderGallery();
      } catch(err) { toast('Erro upload: '+err.message); }
    }
  });
  g.appendChild(add);
}

function renderNFArea(){
  const a = document.getElementById('nfArea');
  a.replaceChildren();
  if (editing.nf_anexo && editing.nf_anexo.url) {
    const pill = el(`<a class="nf-pill" href="${editing.nf_anexo.url}" target="_blank">📄 ${escapeHtml(editing.nf_anexo.name||'Anexo')}</a>`);
    a.appendChild(pill);
    const rm = el('<button class="btn btn-danger" style="margin-left:8px;font-size:12px;padding:4px 8px" type="button">Remover</button>');
    rm.addEventListener('click', () => { editing.nf_anexo = null; renderNFArea(); });
    a.appendChild(rm);
  } else {
    const lab = el('<label class="btn" style="font-size:13px"><input type="file" accept="image/*,application/pdf" style="display:none"> Anexar arquivo</label>');
    lab.querySelector('input').addEventListener('change', async (e) => {
      const f = e.target.files[0]; if(!f) return;
      try { const r = await uploadFile(f, 'nf'); editing.nf_anexo = r; renderNFArea(); }
      catch(err){ toast('Erro upload: '+err.message); }
    });
    a.appendChild(lab);
  }
}

function renderAccArea(){
  const a = document.getElementById('accArea');
  a.replaceChildren();
  (editing.acessorios||[]).forEach((ac, i) => {
    const chip = el(`<div class="acc-chip"><div class="left">🔌 <strong>${escapeHtml(ac.item||'ACESSÓRIO')}</strong> — ${escapeHtml(ac.modelo||'')}<span style="margin-left:8px;font-family:var(--mono);color:var(--accent-dark);font-size:12px">#${escapeHtml(ac.etiqueta||'')}</span> <span class="tag tag-gray" style="margin-left:8px">${escapeHtml(ac.estado||'')}</span></div><button class="x" type="button">&times;</button></div>`);
    chip.querySelector('.x').addEventListener('click', () => { editing.acessorios.splice(i,1); renderAccArea(); });
    a.appendChild(chip);
  });
}

function accLinkFromStock(){
  // Pull free accessories from DATA whose item is non-main (CARREGADOR, WEBCAM, LEITOR...) and not currently in someone's list
  const used = new Set();
  DATA.forEach(a => (a.acessorios||[]).forEach(ac => used.add(String(ac.etiqueta||''))));
  const free = DATA.filter(a => {
    const i = (a.item||'').toUpperCase();
    if (!['CARREGADOR','WEBCAM','LEITOR DE CÓDIGO DE BARRAS','TABLET','MAQUININHA'].some(k => i.includes(k))) return false;
    if ((a.status||'').toUpperCase()!=='ESTOQUE') return false;
    return !used.has(String(a.etiqueta));
  });
  const sel = prompt('Vincular acessório do estoque. Digite a etiqueta:\n' + free.map(a=>'#'+a.etiqueta+' '+a.item+' '+(a.modelo||'')).join('\n'));
  if (!sel) return;
  const tag = sel.replace(/^#?\s*/, '').trim();
  const found = free.find(a => String(a.etiqueta) === tag);
  if (!found) { toast('Etiqueta não encontrada no estoque'); return; }
  editing.acessorios = editing.acessorios||[];
  editing.acessorios.push({ etiqueta: found.etiqueta, item: found.item, marca: found.marca, modelo: found.modelo, serie: found.serie, estado: found.estado||'BOM', status:'EM USO', _linkedId: found.id });
  renderAccArea();
}

function accCreateNew(){
  const item = prompt('Tipo do acessório (ex: CARREGADOR, WEBCAM):');
  if (!item) return;
  const modelo = prompt('Modelo (opcional):') || '';
  const etiqueta = prompt('Etiqueta (opcional):') || '';
  editing.acessorios = editing.acessorios||[];
  editing.acessorios.push({ etiqueta, item: item.toUpperCase(), modelo, estado:'BOM', status:'EM USO' });
  renderAccArea();
}

function renderHistArea(){
  const a = document.getElementById('histArea');
  a.replaceChildren();
  const list = (editing.historico||[]);
  if (!list.length) { a.appendChild(el('<div style="color:var(--muted);font-style:italic;font-size:13px">Nenhuma movimentação registrada.</div>')); return; }
  list.forEach((h, i) => {
    const row = el(`<div style="border-bottom:1px solid var(--border);padding:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-size:13px">
      <div><span class="tag tag-gray">${escapeHtml(h.tipo||'')}</span> <span style="color:var(--muted)">${fmtDate(h.data)}</span><br><strong>${escapeHtml(h.de||'')}</strong> &rarr; <strong>${escapeHtml(h.para||'')}</strong><div style="color:var(--muted)">${escapeHtml(h.observacao||'')}</div></div>
      <button class="x" type="button" style="background:transparent;border:0;color:var(--muted)">&times;</button>
    </div>`);
    row.querySelector('.x').addEventListener('click', () => { editing.historico.splice(i,1); renderHistArea(); });
    a.appendChild(row);
  });
}

function addHistory(){
  const tipo = document.getElementById('hType').value;
  const data = document.getElementById('hDate').value;
  const de = document.getElementById('hFrom').value;
  const para = document.getElementById('hTo').value;
  const obs = document.getElementById('hObs').value;
  if (!para) { toast('Informe o destino'); return; }
  editing.historico = editing.historico||[];
  editing.historico.push({tipo, data, de, para, observacao: obs});
  // If transferência, update responsavel
  if (tipo === 'Transferência' || tipo === 'Devolução') editing.responsavel = para;
  renderHistArea();
  // Clear inputs
  document.getElementById('hTo').value='';
  document.getElementById('hObs').value='';
  // Refresh select option for responsavel
  const sel = document.querySelector('select[data-field="responsavel"]');
  if (sel) sel.value = editing.responsavel||'';
}

async function saveFromModal(){
  if (!editing) return;
  const btn = document.getElementById('mSave');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Salvando...';
  try {
    // Strip non-column fields
    const row = {...editing};
    delete row._isAccessory; delete row._parent; delete row._ref;
    // ensure jsonb arrays
    row.acessorios = row.acessorios||[];
    row.historico = row.historico||[];
    row.imagens = row.imagens||[];
    const id = await saveAsset(row);
    if (!editing.id) editing.id = id;
    await loadAll();
    renderCounts(); render();
    closeModal();
    toast('Salvo!');
  } catch(e){
    toast('Erro: ' + (e.message||e));
  } finally {
    btn.disabled = false; btn.textContent = 'Salvar Alterações';
  }
}

async function delFromModal(){
  if (!editing || !editing.id) return;
  if (!confirm('Excluir este ativo permanentemente?')) return;
  try {
    await deleteAsset(editing.id);
    await loadAll();
    renderCounts(); render();
    closeModal();
    toast('Excluído');
  } catch(e){ toast('Erro: '+e.message); }
}

function exportCSV(){
  if (!DATA.length) return;
  const cols = ['etiqueta','marca','item','modelo','serie','responsavel','status','departamento','estado','valor','valor_atual','data_compra','vencimento','proxima_revisao','fornecedor','nf','idade','vida_util','observacoes','motivo'];
  const lines = [cols.join(';')];
  DATA.forEach(a => {
    lines.push(cols.map(c => {
      const v = a[c]==null?'':String(a[c]).replace(/[;\n\r]/g,' ');
      return v;
    }).join(';'));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ativos.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// ============= Start =============
if (!tryAuth()) { /* lock screen shown by default */ }
</script>
</body>
</html>
